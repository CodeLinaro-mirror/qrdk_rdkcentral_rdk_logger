# RDK Log Suppressor default configuration
# This file is installed to /etc by the Yocto recipe.
# RFC overrides are written to /nvram/rdk_log_suppressor.ini by PAM
# and take precedence on the next process restart/reboot.
#
# FEATURE.RDKLogSuppressor.Enable
#   Enables pattern-based log suppression (AC-4: disabled by default).
#   Valid values: true | false
#
# FEATURE.RDKLogSuppressor.MaxPatternLength
#   Maximum repeating pattern length to detect (AC-5: range 1-20).
#   history buffer = 2 * MaxPatternLength (AC-6).

FEATURE.RDKLogSuppressor.Enable = false
FEATURE.RDKLogSuppressor.MaxPatternLength = 10
